<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 250" role="img" aria-label="Language detection pipeline" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#536171"/></marker></defs><rect width="1180" height="250" rx="14" fill="#ffffff"/><text x="28" y="38" font-size="12" font-weight="700" letter-spacing="1.6" fill="#305b8a">LANGUAGE DETECTION PIPELINE</text><rect x="28" y="70" width="200" height="124" rx="10" fill="#ffffff" stroke="#b47b40" stroke-width="1.4"/><rect x="28" y="70" width="200" height="6" rx="3" fill="#b47b40"/><text x="42" y="98" font-size="10" font-weight="700" letter-spacing="1.2" fill="#b47b40">01 · COLLECT</text><text x="42" y="118" font-size="14.5" font-weight="700" fill="#202c3a">Wikipedia corpus</text><text x="42" y="138" font-size="12" fill="#536171">18 language editions</text><text x="42" y="155" font-size="12" fill="#536171">BeautifulSoup + NLTK</text><rect x="258" y="70" width="200" height="124" rx="10" fill="#ffffff" stroke="#305b8a" stroke-width="1.4"/><rect x="258" y="70" width="200" height="6" rx="3" fill="#305b8a"/><text x="272" y="98" font-size="10" font-weight="700" letter-spacing="1.2" fill="#305b8a">02 · CLEAN</text><text x="272" y="118" font-size="14.5" font-weight="700" fill="#202c3a">Normalise text</text><text x="272" y="138" font-size="12" fill="#536171">strip digits, punctuation</text><text x="272" y="155" font-size="12" fill="#536171">lower-case</text><path d="M230 132 L254 132" fill="none" stroke="#536171" stroke-width="1.6" marker-end="url(#ah)"/><rect x="488" y="70" width="200" height="124" rx="10" fill="#ffffff" stroke="#305b8a" stroke-width="1.4"/><rect x="488" y="70" width="200" height="6" rx="3" fill="#305b8a"/><text x="502" y="98" font-size="10" font-weight="700" letter-spacing="1.2" fill="#305b8a">03 · VECTORISE</text><text x="502" y="118" font-size="14.5" font-weight="700" fill="#202c3a">Bag of words</text><text x="502" y="138" font-size="12" fill="#536171">CountVectorizer</text><text x="502" y="155" font-size="12" fill="#536171">38,837-term vocabulary</text><path d="M460 132 L484 132" fill="none" stroke="#536171" stroke-width="1.6" marker-end="url(#ah)"/><rect x="718" y="70" width="200" height="124" rx="10" fill="#ffffff" stroke="#305b8a" stroke-width="1.4"/><rect x="718" y="70" width="200" height="6" rx="3" fill="#305b8a"/><text x="732" y="98" font-size="10" font-weight="700" letter-spacing="1.2" fill="#305b8a">04 · CLASSIFY</text><text x="732" y="118" font-size="14.5" font-weight="700" fill="#202c3a">Multinomial NB</text><text x="732" y="138" font-size="12" fill="#536171">argmax log P(c)</text><text x="732" y="155" font-size="12" fill="#536171">+ Σ x·log P(w | c)</text><path d="M690 132 L714 132" fill="none" stroke="#536171" stroke-width="1.6" marker-end="url(#ah)"/><rect x="948" y="70" width="200" height="124" rx="10" fill="#ffffff" stroke="#5f8a6e" stroke-width="1.4"/><rect x="948" y="70" width="200" height="6" rx="3" fill="#5f8a6e"/><text x="962" y="98" font-size="10" font-weight="700" letter-spacing="1.2" fill="#5f8a6e">05 · SERVE</text><text x="962" y="118" font-size="14.5" font-weight="700" fill="#202c3a">FastAPI service</text><text x="962" y="138" font-size="12" fill="#536171">POST /predict  (HTML)</text><text x="962" y="155" font-size="12" fill="#536171">POST /predict_text (JSON)</text><path d="M920 132 L944 132" fill="none" stroke="#536171" stroke-width="1.6" marker-end="url(#ah)"/><text x="28" y="228" font-size="12" fill="#536171" text-anchor="start" font-weight="400">11,623 labelled sentences · stratified 80/20 split · 97.9 % held-out accuracy</text></svg>